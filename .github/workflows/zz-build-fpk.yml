name: Build Octop FPK + Image

# 在 main 分支有更新（含上游同步推送）时：
#   image  job：从仓库源码构建 Octop Docker 镜像，推送到 GHCR（ghcr.io/veenyi/octop:latest）
#   fpk    job：构建「Docker 版」飞牛安装包 octop-<ver>.fpk（依赖 image，确保镜像已就绪）
#   native job：构建「本地版（非 Docker）」飞牛安装包 octop-native-<ver>.fpk。
#               不内置 Python 运行时（依赖飞牛应用商店 Python 3.12），
#               仅内置 Octop 核心 whl + 核心依赖 site-packages，不含浏览器二进制与预装技能。
#   release job：将两个 .fpk 以滚动发布 fnos-latest 形式提供下载
#
# 镜像包随公开仓库默认即为 public，无需额外设置可见性。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-octop
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: ver
        run: |
          VER=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([0-9][0-9.]*[0-9])".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fnos/Dockerfile
          push: true
          tags: |
            ghcr.io/veenyi/octop:latest
            ghcr.io/veenyi/octop:v${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fpk:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker FPK
        run: bash scripts/build-fpk.sh docker

      - name: Upload docker fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-fpk
          path: dist/octop-*.fpk
          if-no-files-found: error

  native:
    # 即使原生版构建失败也不阻塞整体发布：Docker 版（fpk）始终会发布；
    # 原生版成功则一并附带。continue-on-error 让 needs 视为通过。
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          VER=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([0-9][0-9.]*[0-9])".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12 (build-only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official Octop core wheel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=${{ steps.ver.outputs.version }}
          echo "Downloading official Octop core wheel v${VER} ..."
          gh release download "v${VER}" --repo TencentCloud/Octop \
            --pattern "octop-${VER}-py3-none-any.whl" --clobber
          ls -lh octop-*.whl

      - name: Install Octop core into app/site-packages (no Chromium, no preinstalled skills)
        env:
          UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.uv-python
        run: |
          mkdir -p "${{ github.workspace }}/fnos-native/app/site-packages"
          # 用 uv 安装核心 whl 及其依赖到包内 site-packages。
          # pip 对 orcakit-harness-agent[all] 的复杂依赖树会报 resolution-too-deep，
          # uv 的回溯能力强得多（旧方案已验证）。
          python3 -m pip install --quiet uv
          python3 -m uv pip install --python python3.12 \
            --target "${{ github.workspace }}/fnos-native/app/site-packages" \
            --no-cache "$(ls octop-*.whl | head -1)"
          # 把核心 whl 也内置进去，供飞牛主机离线重装/回滚使用。
          cp octop-*.whl "${{ github.workspace }}/fnos-native/app/site-packages/octop.whl"
          PYTHONPATH="${{ github.workspace }}/fnos-native/app/site-packages" python3.12 \
            -c "import octop; print('octop', octop.__version__)"

      - name: Build native FPK
        run: bash scripts/build-fpk.sh native

      - name: Show native fpk size
        run: ls -lh dist/octop-native-*.fpk

      - name: Upload native fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-fpk
          path: dist/octop-native-*.fpk
          if-no-files-found: error

  release:
    # 即使原生版失败（continue-on-error）也要发布 Docker 版；
    # 原生版成功时 artifacts/native-fpk 存在，会被一并打包进发布。
    if: always()
    needs: [fpk, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 分别按名称下载，单个大产物（native-fpk ~560MB）单独下载比「下载全部」更稳定，
      # 避免 GitHub artifact 服务对“全部”模式偶发 5 次重试失败。
      - name: Download docker fpk artifact (required)
        uses: actions/download-artifact@v4
        with:
          name: docker-fpk
          path: artifacts/docker-fpk
          if-no-files-found: error

      - name: Download native fpk artifact (best-effort)
        # 原生版即使下载/解压偶发失败也不阻塞发布：Docker 版始终会随 fnos-latest 提供。
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: native-fpk
          path: artifacts/native-fpk
          if-no-files-found: ignore

      - name: Stage dist
        run: |
          mkdir -p dist
          cp artifacts/docker-fpk/*.fpk dist/ || true
          cp artifacts/native-fpk/*.fpk dist/ || true
          ls -lh dist

      - name: Delete rolling release if exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=fnos-latest
          REL_ID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/veenyi/Octop/releases/tags/$TAG \
            | python -c "import sys,json;d=json.load(sys.stdin);print(d.get('id',''))" 2>/dev/null || true)
          if [ -n "$REL_ID" ]; then
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/veenyi/Octop/releases/$REL_ID || true
          fi
          curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/veenyi/Octop/git/refs/tags/$TAG || true

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fnos-latest
          name: Octop (FnOS) latest
          body: |
            自动构建的飞牛 FnOS 安装包，基于 Octop 源码构建（已做减法：不内置 Python 运行时、不预装组件）。
            - 镜像：ghcr.io/veenyi/octop:latest
            - octop-<ver>.fpk —— Docker 版（飞牛自动从 GHCR 拉取镜像运行，包仅 ~8KB）
            - octop-native-<ver>.fpk —— 本地版（非 Docker，原生运行在飞牛主机；安装时自动关联系统 Python 3.12 开发工具；浏览器、远程桌面等附加组件在 Octop 应用内按需安装）
            在飞牛「应用中心 → 设置 → 手动安装应用」选择对应 .fpk 即可。
          files: dist/*.fpk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
