name: Build Octop FPK + Image

# 在 main 分支有更新（含上游同步推送）时：
#   image  job：从仓库源码构建 Octop Docker 镜像，推送到 GHCR（ghcr.io/veenyi/octop:latest）
#   fpk    job：构建「Docker 版」飞牛安装包 octop-<ver>.fpk（依赖 image，确保镜像已就绪）
#   native job：在 Linux 上自包含构建「本地版（非 Docker）」运行时（Python + 前端 + 全部附加组件 + Chromium）
#   release job：将两个 .fpk 以滚动发布 fnos-latest 形式提供下载
#
# 镜像包随公开仓库默认即为 public，无需额外设置可见性。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-octop
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: ver
        run: |
          VER=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([0-9][0-9.]*[0-9])".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fnos/Dockerfile
          push: true
          tags: |
            ghcr.io/veenyi/octop:latest
            ghcr.io/veenyi/octop:v${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fpk:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker FPK
        run: bash scripts/build-fpk.sh docker

      - name: Upload docker fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-fpk
          path: dist/octop-*.fpk
          if-no-files-found: error

  native:
    # 即使原生版构建失败也不阻塞整体发布：Docker 版（fpk）始终会发布；
    # 原生版成功则一并附带。continue-on-error 让 needs 视为通过。
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          VER=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([0-9][0-9.]*[0-9])".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download official Octop core wheel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=${{ steps.ver.outputs.version }}
          echo "Downloading official Octop core wheel v${VER} ..."
          gh release download "v${VER}" --repo TencentCloud/Octop \
            --pattern "octop-${VER}-py3-none-any.whl" --clobber
          ls -lh octop-*.whl

      - name: Download portable Python (python-build-standalone)
        run: |
          # 使用真实存在的 20260718 发布中的 3.12.13 便携版。
          PYVER=cpython-3.12.13+20260718-x86_64-unknown-linux-gnu-install_only.tar.gz
          curl -sSL -o /tmp/py.tgz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/20260718/$PYVER"
          mkdir -p fnos-native/app/runtime/python
          tar -xzf /tmp/py.tgz -C fnos-native/app/runtime/python --strip-components=1
          fnos-native/app/runtime/python/bin/python3.12 --version

      - name: Install Octop core (no Chromium, no preinstalled skills)
        run: |
          PY=${{ github.workspace }}/fnos-native/app/runtime/python/bin/python3.12
          "$PY" -m pip install --quiet --upgrade pip
          # 仅安装核心 whl：其依赖自动从 PyPI 拉取，但不执行 playwright install chromium，
          # 也不装 [desktop] extra。Chromium 浏览器二进制与专家/技能均留待用户在 Octop 界面
          # 按需安装，从而把本地安装包从 ~600MB 减到 ~200MB 以内。
          # 把 whl 一并内置到 runtime 目录，供飞牛主机离线重装/回滚使用。
          cp octop-*.whl "${{ github.workspace }}/fnos-native/app/runtime/octop.whl"
          "$PY" -m pip install --no-cache "$(ls octop-*.whl | head -1)"
          "$PY" -c "import octop; print('octop', octop.__version__)"

      - name: Build native FPK
        run: bash scripts/build-fpk.sh native

      - name: Show native fpk size
        run: ls -lh dist/octop-native-*.fpk

      - name: Upload native fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-fpk
          path: dist/octop-native-*.fpk
          if-no-files-found: error

  release:
    # 即使原生版失败（continue-on-error）也要发布 Docker 版；
    # 原生版成功时 artifacts/native-fpk 存在，会被一并打包进发布。
    if: always()
    needs: [fpk, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 分别按名称下载，单个大产物（native-fpk ~560MB）单独下载比「下载全部」更稳定，
      # 避免 GitHub artifact 服务对“全部”模式偶发 5 次重试失败。
      - name: Download docker fpk artifact (required)
        uses: actions/download-artifact@v4
        with:
          name: docker-fpk
          path: artifacts/docker-fpk
          if-no-files-found: error

      - name: Download native fpk artifact (best-effort)
        # 原生版即使下载/解压偶发失败也不阻塞发布：Docker 版始终会随 fnos-latest 提供。
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: native-fpk
          path: artifacts/native-fpk
          if-no-files-found: ignore

      - name: Stage dist
        run: |
          mkdir -p dist
          cp artifacts/docker-fpk/*.fpk dist/ || true
          cp artifacts/native-fpk/*.fpk dist/ || true
          ls -lh dist

      - name: Delete rolling release if exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=fnos-latest
          REL_ID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/veenyi/Octop/releases/tags/$TAG \
            | python -c "import sys,json;d=json.load(sys.stdin);print(d.get('id',''))" 2>/dev/null || true)
          if [ -n "$REL_ID" ]; then
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/veenyi/Octop/releases/$REL_ID || true
          fi
          curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/veenyi/Octop/git/refs/tags/$TAG || true

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fnos-latest
          name: Octop (FnOS) latest
          body: |
            自动构建的飞牛 FnOS 安装包，基于 Octop 源码构建，已包含全部附加组件（browser + desktop）。
            - 镜像：ghcr.io/veenyi/octop:latest
            - octop-<ver>.fpk —— Docker 版（飞牛自动从 GHCR 拉取镜像运行，包仅 ~8KB）
            - octop-native-<ver>.fpk —— 本地版（非 Docker，自带 Python 运行时 + 前端 + 全部附加组件 + Chromium，直接原生运行在飞牛主机）
            在飞牛「应用中心 → 设置 → 手动安装应用」选择对应 .fpk 即可。
          files: dist/*.fpk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
