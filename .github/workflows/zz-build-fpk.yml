name: Build Octop FPK + Image

# 在 main 分支有更新（含上游同步推送）时：
#   image  job：从仓库源码构建 Octop Docker 镜像，推送到 GHCR（ghcr.io/veenyi/octop:latest）
#   fpk    job：构建「Docker 版」飞牛安装包 octop-<ver>.fpk（依赖 image，确保镜像已就绪）
#   native job：构建「本地版（非 Docker）」飞牛安装包 octop-native-<ver>.fpk。
#               不内置 Python 运行时（依赖飞牛应用商店 Python 3.12），
#               仅内置 Octop 核心 whl + 核心依赖 site-packages，不含浏览器二进制与预装技能。
#   release job：将两个 .fpk 以滚动发布 fnos-latest 形式提供下载
#
# 镜像包随公开仓库默认即为 public，无需额外设置可见性。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-octop
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read version
        id: ver
        run: |
          VER=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([0-9][0-9.]*[0-9])".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fnos/Dockerfile
          push: true
          tags: |
            ghcr.io/veenyi/octop:latest
            ghcr.io/veenyi/octop:v${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fpk:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Docker FPK
        run: bash scripts/build-fpk.sh docker

      - name: Upload docker fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-fpk
          path: dist/octop-*.fpk
          if-no-files-found: error

  native:
    # 即使原生版构建失败也不阻塞整体发布：Docker 版（fpk）始终会发布；
    # 原生版成功则一并附带。continue-on-error 让 needs 视为通过。
    continue-on-error: true
    runs-on: ubuntu-latest
    outputs:
      native_ok: ${{ steps.build_native.outcome == 'success' && steps.upload_native.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          VER=$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([0-9][0-9.]*[0-9])".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12 (build-only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download official Octop core wheel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=${{ steps.ver.outputs.version }}
          echo "Downloading official Octop core wheel v${VER} ..."
          gh release download "v${VER}" --repo TencentCloud/Octop \
            --pattern "octop-${VER}-py3-none-any.whl" --clobber
          ls -lh octop-*.whl

      - name: Install Octop core into app/site-packages (no Chromium, no preinstalled skills)
        id: install_core
        env:
          UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.uv-python
        run: |
          set -x
          exec 1> >(tee -a "${{ github.workspace }}/native-install.log") 2>&1
          mkdir -p "${{ github.workspace }}/fnos-native/app/site-packages"
          # 用 uv 安装核心 whl 及其依赖到包内 site-packages。
          # pip 对 orcakit-harness-agent[all] 的复杂依赖树会报 resolution-too-deep，
          # uv 的回溯能力强得多（旧方案已验证）。
          python3 -m pip install --quiet uv
          SP="${{ github.workspace }}/fnos-native/app/site-packages"
          # 第一步：让 uv 自由解析并安装核心 whl（含其完整依赖树）。
          # 自由解析会拉到最新的 mcp==2.0.0 + langchain-mcp-adapters==0.3.1，这两者在结构上
          # 不兼容（见第二步），但本步只负责把依赖装齐，不要求版本正确。
          # 注意：不能把钉版与 octop.whl 放在同一条 uv 命令里——会和 whl 的传递依赖约束
          # 发生 resolution 冲突，导致整个 native 构建失败（fdca4c6 的教训）。
          python3 -m uv pip install --python python3.12 \
            --target "$SP" --no-cache "$(ls octop-*.whl | head -1)"
          # 第二步：强制覆盖为仓库 uv.lock 锁定的兼容组合 mcp==1.28.1 + langchain-mcp-adapters==0.3.0。
          # mcp 2.0 移除了 mcp.server.fastmcp / mcp.shared.context.RequestContext 等符号，
          # 而 langchain-mcp-adapters 0.3.x 仍硬导入它们，导致 octop 启动即 ImportError。
          # 先清掉旧版目录，防止多版本共存导致 Python 仍加载坏的 mcp 2.0。
          rm -rf "$SP/mcp" "$SP"/mcp-*.dist-info \
                 "$SP/langchain_mcp_adapters" "$SP"/langchain_mcp_adapters-*.dist-info
          # 在 target 模式下 uv 的 --force-reinstall 行为与 pip 不同，且 CI 日志不可见，
          # 这里改用 pip 完成钉版（pip 对 --target --force-reinstall --no-deps 更稳定）。
          python3.12 -m pip install --target "$SP" --no-deps --no-cache-dir --force-reinstall \
            "mcp==1.28.1" "langchain-mcp-adapters==0.3.0"
          # 把核心 whl 也内置进去，供飞牛主机离线重装/回滚使用。
          cp octop-*.whl "$SP/octop.whl"
          # 校验：必须能走通真正的启动导入链（octop.launch → octop.infra.server →
          # harness_agent.mcp → langchain_mcp_adapters）。仅 import octop 不会触发该链路，
          # 故这里显式导入启动入口，确保 mcp/langchain-mcp-adapters 组合确实可用。
          PYTHONPATH="$SP" python3.12 \
            -c "from octop.launch import run_foreground_blocking; import mcp, langchain_mcp_adapters; print('octop', octop.__version__, '| mcp', mcp.__version__, '| lcma', langchain_mcp_adapters.__version__)"

      - name: Build native FPK
        id: build_native
        run: bash scripts/build-fpk.sh native

      - name: Show native fpk size
        run: ls -lh dist/octop-native-*.fpk

      - name: Upload native fpk artifact
        id: upload_native
        uses: actions/upload-artifact@v4
        with:
          name: native-fpk
          path: dist/octop-native-*.fpk
          if-no-files-found: error

      - name: Upload native install log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-install-log
          path: native-install.log
          if-no-files-found: ignore

  release:
    # 即使原生版失败（continue-on-error）也要发布 Docker 版；
    # 原生版成功时 artifacts/native-fpk 存在，会被一并打包进发布。
    if: always()
    needs: [fpk, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 分别按名称下载，单个大产物（native-fpk ~560MB）单独下载比「下载全部」更稳定，
      # 避免 GitHub artifact 服务对“全部”模式偶发 5 次重试失败。
      - name: Download docker fpk artifact (required)
        uses: actions/download-artifact@v4
        with:
          name: docker-fpk
          path: artifacts/docker-fpk
          if-no-files-found: error

      - name: Download native fpk artifact (best-effort)
        # 原生版即使下载/解压偶发失败也不阻塞发布：Docker 版始终会随 fnos-latest 提供。
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: native-fpk
          path: artifacts/native-fpk
          if-no-files-found: ignore

      - name: Stage dist
        run: |
          mkdir -p dist
          cp artifacts/docker-fpk/*.fpk dist/ || true
          cp artifacts/native-fpk/*.fpk dist/ || true
          ls -lh dist

      - name: Delete rolling release if exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=fnos-latest
          REL_ID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/veenyi/Octop/releases/tags/$TAG \
            | python -c "import sys,json;d=json.load(sys.stdin);print(d.get('id',''))" 2>/dev/null || true)
          if [ -n "$REL_ID" ]; then
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/veenyi/Octop/releases/$REL_ID || true
          fi
          curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/veenyi/Octop/git/refs/tags/$TAG || true

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fnos-latest
          name: Octop (FnOS) latest
          body: |
            自动构建的飞牛 FnOS 安装包，基于 Octop 源码构建（已做减法：不内置 Python 运行时、不预装组件）。
            - 镜像：ghcr.io/veenyi/octop:latest
            - octop-<ver>.fpk —— Docker 版（飞牛自动从 GHCR 拉取镜像运行，包仅 ~8KB）
            - octop-native-<ver>.fpk —— 本地版（非 Docker，原生运行在飞牛主机；安装时自动关联系统 Python 3.12 开发工具；浏览器、远程桌面等附加组件在 Octop 应用内按需安装）
            在飞牛「应用中心 → 设置 → 手动安装应用」选择对应 .fpk 即可。
          files: dist/*.fpk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
