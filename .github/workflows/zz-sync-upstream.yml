name: Sync upstream Octop

# 自动把上游 TencentCloud/Octop 的更新同步到本仓库的两个分支：
#   - main    ：整合版（6 仓库融合 + 上传放开 + 飞牛打包基建）
#   - vanilla ：原版（仅飞牛打包基建 + fnos-operator 专家，其余与上游一致）
#
# 两个分支各自独立合并上游 main 后分别推送；推送会各自触发对应的构建工作流
# （main 触发 zz-build-fpk.yml，vanilla 触发 zz-build-fpk-vanilla.yml），
# 完成双环境（Docker + 本地版）的重新打包与发布。无需在此显式 gh workflow run，
# 否则会与 push 触发的构建重复（靠 concurrency 排队还可能产生重复 release）。
#
# 「.gitignore 末尾追加」类冲突通过仓库根目录 .gitattributes 的
#   `.gitignore merge=union`
# 全自动合并，无需人工介入。其它无法自动解决的冲突会中止本次同步、下次重试。
#
# 定时每 6 小时检查一次，也可在 Actions 页面手动触发（workflow_dispatch）。

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
          - branch: vanilla
    permissions:
      contents: write
      actions: write
    concurrency:
      group: sync-upstream-${{ matrix.branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync from TencentCloud/Octop
        id: sync
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/TencentCloud/Octop.git \
            || git remote set-url upstream https://github.com/TencentCloud/Octop.git

          BEFORE=$(git rev-parse HEAD)

          # 用 FETCH_HEAD 可靠引用上游 main，避免 remote-tracking ref 未创建导致 merge 失败。
          git fetch upstream main

          if ! git merge FETCH_HEAD --no-edit; then
            echo "合并出现无法自动解决的冲突，已中止本次 ${{ matrix.branch }} 同步（下次重试）。"
            git merge --abort || true
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            git push origin ${{ matrix.branch }}
            echo "synced=true" >> "$GITHUB_OUTPUT"
            echo "✅ 已同步上游更新并推送到 ${{ matrix.branch }}（将自动触发该分支的构建工作流）。"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "✅ ${{ matrix.branch }} 已是最新，无需推送。"
          fi
