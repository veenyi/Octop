name: Sync upstream Octop

# 自动把上游 TencentCloud/Octop 的更新同步到本仓库（飞牛打包仓）。
# - 每 6 小时定时检查一次
# - 也可在 Actions 页面手动触发（workflow_dispatch）
# 同步成功并 push 后，会自动触发「Build Octop FPK + Image」工作流，
# 完成双环境（Docker + 本地版）的重新打包与发布。
#
# 注意：用 GITHUB_TOKEN 推送不会自动触发其它 workflow，因此最后一步
# 显式调用 gh workflow run 触发构建。

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync from TencentCloud/Octop
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add upstream https://github.com/TencentCloud/Octop.git \
            || git remote set-url upstream https://github.com/TencentCloud/Octop.git

          BEFORE=$(git rev-parse HEAD)

          # 用 FETCH_HEAD 可靠引用上游 main，避免 remote-tracking ref 未创建导致 merge 失败。
          git fetch upstream main

          if ! git merge -X theirs FETCH_HEAD --no-edit; then
            echo "合并出现无法自动解决的冲突，已中止本次同步（下次重试）。"
            git merge --abort || true
            echo "synced=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AFTER=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$AFTER" ]; then
            git push origin main
            echo "synced=true" >> "$GITHUB_OUTPUT"
            echo "✅ 已同步上游更新并推送到 main。"
          else
            echo "synced=false" >> "$GITHUB_OUTPUT"
            echo "✅ 已是最新，无需推送。"
          fi

      - name: Trigger build & release
        if: steps.sync.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "同步到新提交，触发双环境构建与发布 ..."
          gh workflow run zz-build-fpk.yml
